[package]
name = "home-video-editor"
version = "0.2.0"
description = "A focused 4K home video editor"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
