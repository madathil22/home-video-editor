name: Release

# Tag a commit to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The installer is built from that tag and attached to a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ffmpeg/ffprobe are ~138 MB each and not committed, so restore them from
      # cache or download the pinned build. The cache key is the fetch script
      # itself, which is where the pinned version lives.
      - name: Cache ffmpeg sidecars
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('tools/fetch-ffmpeg.ps1') }}

      - name: Fetch ffmpeg sidecars
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: .\tools\fetch-ffmpeg.ps1
        shell: pwsh

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Home Video Editor ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Download the `.exe` installer below and run it. ffmpeg and ffprobe
            are bundled, so there is nothing else to install.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            for what changed.
          releaseDraft: false
          prerelease: false
